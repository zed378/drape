name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Rust Windows x64 gates
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.90.0-x86_64-pc-windows-msvc
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin Python for architecture and gate checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'

      - name: Pin Rust and helper tools
        run: ./scripts/ci/install-tools.ps1

      - name: Record build environment
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          rustc -vV | Out-File coverage/environment.txt
          cargo -V | Out-File coverage/environment.txt -Append
          cargo llvm-cov --version | Out-File coverage/environment.txt -Append
          cargo deny --version | Out-File coverage/environment.txt -Append
          gitleaks version | Out-File coverage/environment.txt -Append
          rustup show | Out-File coverage/environment.txt -Append
          Get-FileHash Cargo.lock | Format-List | Out-File coverage/environment.txt -Append
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber |
            Format-List | Out-File coverage/environment.txt -Append
          & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -format json |
            Out-File coverage/environment.txt -Append

      # No shared writable cache: fork PRs cannot populate a trusted release cache.
      - name: Locked release build
        run: cargo build --workspace --release --locked

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Denied-warning Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests
        run: |
          cargo test --workspace --locked 2>&1 | Tee-Object coverage/workspace-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Architecture and real dependency mutations
        run: python scripts/check-rust-boundaries.py

      - name: Demonstrate warning and formatting rejection
        run: python scripts/ci/check-quality-gates.py

      - name: Core coverage at least 80 percent
        run: |
          python scripts/ci/test-core-coverage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov --package drape-core --locked --json --output-path coverage/core.json --fail-under-lines 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/check-core-coverage.py coverage/core.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov report --package drape-core --lcov --output-path coverage/core.lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dependency licences and advisories
        run: cargo deny --locked check advisories licenses sources

      - name: Secret scan including Git history
        run: gitleaks git --redact --exit-code 1 --report-format json --report-path coverage/gitleaks.json .

      - name: Archive verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-windows-evidence
          path: |
            coverage/
            Cargo.lock
            rust-toolchain.toml
            THIRD_PARTY_NOTICES.md
            docs/ENGINEERING/R0-02-DEPENDENCIES.md
          if-no-files-found: error
          retention-days: 14
